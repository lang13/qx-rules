# ============================================================
# 微信 / 小程序 去广告 —— Quantumult X 总览版（手动粘贴用）
# ------------------------------------------------------------
# 来源：uefibin/shadowrocket-rules（AdBlock_Live.conf，2026-11-23 实测版）
#       已由小火箭语法转写为 QX 语法
# 提醒：小程序 5 秒开屏封面广告走微信 MTLM/MMTLS 加密，代理层无解；
#       要彻底关闭请用微信「未成年人模式」并把小程序权限设为「全部」
# ============================================================

[filter_local]
# 腾讯优量汇 / 广点通（小程序流量主广告主投放域）
host-suffix, gdt.qq.com, reject
host-suffix, ugdtimg.com, reject
host, qzs.gdtimg.com, reject

# 广告上报与监控（不影响功能）
host, report-online.sh.wxgateway.com, reject
host, szreport.weixin.qq.com, reject


[rewrite_local]
# 小程序内广告素材图 → 1px 透明图
^https?:\/\/wximg\.wxs\.qq\.com\/141\/20204\/snscosdownload\/ url reject-img
^https?:\/\/wxsnsdythumb\.wxs\.qq\.com\/141\/20204\/snscosdownload\/ url reject-img
# 多图广告上报接口 → 空 200
^https?:\/\/mp\.weixin\.qq\.com\/intp\/mmdata\?action\=reportmultimon url reject-200


[mitm]
# 只解密这两个子域，不要写 *.qq.com
hostname = *.wxs.qq.com, mp.weixin.qq.com
