# 番茄小说 / 红果短剧 去广告 —— 重写规则（Quantumult X 引用专用）
# 纯规则文件，不含段头；直接用「重写 -> 引用」添加本文件 URL
# 源: liidolidol/fanqie-hongguo-adblock v1.6.0 (2026-11-22) 转写
# MITM 域名需在 QX 的 MitM 页单独添加

^https?:\/\/.+\.pangolin-sdk-toutiao\.com\/api\/ad\/union\/sdk\/(get_ads|stats|settings)\/ url reject
^https?:\/\/.+\.(pglstatp-toutiao|pstatp)\.com\/(obj|img)\/(ad-app-package|ad)\/.+ url reject
^https?:\/\/.+\.(pglstatp-toutiao|pstatp)\.com\/(obj|img)\/web\.business\.image\/.+ url reject
^https?:\/\/.+\.(pglstatp-toutiao|pstatp)\.com\/obj\/ad-pattern\/renderer url reject
^https?:\/\/gurd\.snssdk\.com\/src\/server\/v3\/package url reject
^https?:\/\/.+\.byteimg\.com\/tos-cn-i-1yzifmftcy\/(.+)-jpeg\.jpeg url reject
^https?:\/\/.+\.pstatp\.com\/obj\/mosaic-legacy\/.+\?from\=ad url reject
^https?:\/\/.+\.pstatp\.com\/bytecom\/resource\/track-log\/src\/.+ url reject
^https?:\/\/.+\.snssdk\.com\/api\/ad\/.+ url reject
^https?:\/\/.+?\.snssdk\.com\/motor\/operation\/activity\/display\/config\/V2\/ url reject
^https?:\/\/.+reading-ad\.qznovelvod\.com\/.+ url reject
^https?:\/\/v\d+-novelapp\.fqnovelvod\.com\/.+\/video\/.+ url reject

# ===== 阅读流插页广告（阅读中途弹出的 6 秒广告主通道）=====
# 来源：番茄小说 iOS 7.4.1 IPA 逆向分析，SSReadingAdManager(Mannor) 在翻页时把整页广告插进正文序列
# 只拦物料接口，不整段屏蔽 ad.zijieapi.com，否则「看视频免广告」等官方激励任务会挂
^https?:\/\/ad\.zijieapi\.com\/api\/ad\/v1\/(banner|patch|inspire|recall_ads)\/ url reject
# 章末商品 / 游戏卡（软广告），与正文同域，只能按路径区分
^https?:\/\/reading\.snssdk\.com\/reading\/commerceapi\/(chapter_end\/resource|ad\/mix_game|ad\/comment)\/ url reject
^https?:\/\/reading\.snssdk\.com\/reading\/reader\/(recommend|banner\/mget)\/ url reject
# 穿山甲联盟直投（不限定域名，兜住新接入的广告位）
^https?:\/\/.+?\/api\/ad\/union\/sdk\/get_ads\/ url reject
